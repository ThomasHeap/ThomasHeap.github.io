---
layout: default
---
<article class="post">
    <h2 class="post-title">{{ page.title }}</h2>
    <p class="post-date">{{ page.date | date: "%-d %B %Y" }}</p>

    <div class="post-content">
        {{ content }}
    </div>

    <p class="post-back"><a href="/blog">&laquo; Back to blog</a></p>
</article>
